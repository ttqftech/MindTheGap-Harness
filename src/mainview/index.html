<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindTheGap-Harness</title>

    <!-- 启动加载页样式：内联，不依赖任何 JS / 外部 CSS。
         目的：main.tsx 下载执行前（以及 hutch 抽风白屏时）给用户一个像样的画面，而不是一片白。颜色与 theme/theme.css 的深/浅主题手动对齐。 -->
    <style>
      :root {
        --boot-bg: #1a1a1a; /* 深色 --ff */
        --boot-fg: #eee; /* 深色 --fontColor */
        --boot-dim: #888; /* 深色 --fontColorMuted */
        --boot-accent: #6699ff; /* --primary: hwb(220 40% 0%) */
        --boot-track: #2e2e2e; /* 深色 --e7 */
      }
      html.boot-light {
        --boot-bg: #ffffff; /* 浅色 --ff */
        --boot-fg: #222;
        --boot-dim: #888;
        --boot-track: #e7e7e7;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--boot-bg);
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: var(--boot-bg);
        color: var(--boot-fg);
        font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        user-select: none;
        -webkit-app-region: drag;
        transition: opacity 0.24s ease;
      }
      #boot.boot-hide {
        opacity: 0;
        pointer-events: none;
      }

      /* Logo：MindTheGap —— 两段被「间隙」隔开的圆角块，中间一颗点来回穿过 */
      .boot-logo {
        width: 76px;
        height: 76px;
      }
      .boot-dot {
        animation: boot-cross 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-cross {
        0% {
          transform: translateX(-20px);
          opacity: 0.35;
        }
        45% {
          opacity: 1;
        }
        55% {
          opacity: 1;
        }
        100% {
          transform: translateX(20px);
          opacity: 0.35;
        }
      }

      #boot-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--boot-fg);
      }
      #boot-sub {
        font-size: 12px;
        color: var(--boot-dim);
        letter-spacing: 0.05em;
      }

      /* 不确定进度条 */
      #boot-bar {
        width: 148px;
        height: 3px;
        border-radius: 2px;
        background: var(--boot-track);
        overflow: hidden;
      }
      #boot-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: var(--boot-accent);
        animation: boot-slide 1.25s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-105%);
        }
        100% {
          transform: translateX(255%);
        }
      }

      /* 卡住提示：纯 CSS 延时出现（15s 后仍未加载完），不需要 JS */
      #boot-stuck {
        position: absolute;
        bottom: 42px;
        font-size: 11px;
        color: var(--boot-dim);
        opacity: 0;
        animation: boot-appear 0.4s 15s forwards;
      }
      @keyframes boot-appear {
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-dot,
        .boot-bar::after {
          animation: none;
        }
        .boot-dot {
          transform: translateX(0);
          opacity: 1;
        }
        .boot-bar::after {
          width: 100%;
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- 启动加载页（main.tsx 挂载后淡出移除） -->
    <div id="boot">
      <svg class="boot-logo" viewBox="0 0 76 76" fill="none" aria-hidden="true">
        <rect x="2" y="28" width="30" height="20" rx="7" fill="var(--boot-track)" />
        <rect x="44" y="28" width="30" height="20" rx="7" fill="var(--boot-track)" />
        <circle class="boot-dot" cx="38" cy="38" r="7" fill="var(--boot-accent)" />
      </svg>
      <div id="boot-title">MindTheGap-Harness</div>
      <div id="boot-bar"></div>
      <div id="boot-sub">正在启动…</div>
      <div id="boot-stuck">启动时间异常，可能是开发服务未就绪或渲染进程卡住了</div>
    </div>

    <div id="root"></div>

    <script>
      // 记录启动时刻，供 main.tsx 计算加载耗时
      window.__bootStart = performance.now();
      // 让加载页跟随已保存的主题（theme.ts 存在 localStorage 的 'colorTheme'）
      try {
        var colorTheme = localStorage.getItem('colorTheme');
        var isLight = colorTheme === 'light' || ((colorTheme === 'system' || !colorTheme) && window.matchMedia('(prefers-color-scheme: light)').matches);
        if (isLight) document.documentElement.classList.add('boot-light');
      } catch (e) {
        /* localStorage 不可用时保持深色 */
      }
    </script>
    <!-- FFBox-UI 不走这里注入：实测 index.html 注入 + main.tsx import 时，
         Rollup 会把模块在两个入口间共享（产物字节数完全相同，无重复），
         但 dev 模式下 vendor 不在 vite root 内会 404 白报一个错误。
         统一由 ffboxBridge.ts 里的 `import 'ffbox-ui'` 引入即可。 -->
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
